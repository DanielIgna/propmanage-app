<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PropManage</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0a0a0b;
        color: #f5f5f4;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        width: min(560px, 100%);
      }
      .kicker {
        color: #d4ff3a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.15;
      }
      p {
        margin: 0 0 28px;
        color: #a8a29e;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: #d4ff3a;
        color: #0a0a0b;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Cloudflare · live</p>
      <h1>Cartea Digitală a Casei Tale</h1>
      <p>
        PropManage rulează pe edge. Aplicația completă rămâne pe domeniul de producție.
      </p>
      <a href="https://propmanage.ro">Deschide PropManage</a>
    </main>
  </body>
</html>
